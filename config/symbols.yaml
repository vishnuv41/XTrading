# config/symbols.yaml
# ---------------------
# Reference list of tracked pairs. config/settings.py reads SYMBOLS and
# TIMEFRAMES from env vars for actual runtime config (so deployments can
# override without editing code) — this file is the checked-in, human-
# readable source those env vars should be kept in sync with, and what
# a setup script/README can point people at.

exchange: binance

symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

timeframes:
  - 1m
  - 5m
  - 15m
  - 1h
  - 4h
  - 1d

base_timeframe: 1m   # fetched from the exchange directly; others are derived via preprocessing/resampler.py
